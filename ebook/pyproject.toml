[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pista-ebook"
version = "0.1.0"
description = "Pipeline local para pesquisar, redigir e compilar o ebook PISTA"
requires-python = ">=3.11"
dependencies = ["PyMuPDF>=1.24,<3"]

[project.optional-dependencies]
preview = ["Pillow>=10,<12"]

[project.scripts]
pista = "pista.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
